name: fuel_app
description: "A new Flutter project connected to Django backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  http: ^1.2.1

  # Social Auth
  sign_in_with_apple: ^5.0.0
  google_sign_in: ^6.2.1

  # Maps & Utilities
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.5

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^2.15.0
  firebase_auth: ^4.10.0
  cloud_firestore: ^4.9.0
  firebase_messaging: ^14.9.0
  flutter_stripe: ^13.0.0
  google_fonts: ^6.0.0
  flutter_glass_morphism: ^1.0.2
  animations: ^2.0.5
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  meta: 1.18.1
  matcher: 0.12.19
  test_api: 0.7.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700